# Cloudflare Workers configuration.
#
# The site deploys as a single Worker: static assets from ./dist, plus the
# /api/* proxy implemented in worker/index.js.
#
#   npm run build && npx wrangler deploy
#
# Connected to Git in the Cloudflare dashboard, this is what the build and
# deploy commands use.

name = "aram-mayhem"
main = "./worker/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist/"
binding = "ASSETS"
# Hash routing means real paths are always "/", but this keeps any direct
# path request landing on the app rather than a 404.
not_found_handling = "single-page-application"
# Only API paths invoke the Worker; everything else is served straight from
# assets without a script execution.
run_worker_first = [ "/api/*" ]
