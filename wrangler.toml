# Cloudflare Workers configuration.
#
# The site deploys as a single Worker: static assets from ./dist, plus the
# /api/* proxy implemented in worker/index.js.
#
#   npm run build && npx wrangler deploy
#
# Connected to Git in the Cloudflare dashboard, this is what the build and
# deploy commands use.

name = "aram-mayhem"
main = "./worker/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist/"
binding = "ASSETS"
# Deliberately NOT "single-page-application". The app uses hash routing, so the
# only real navigation path is "/" and an SPA fallback buys nothing — but it
# does real harm: it answers *every* unmatched path with index.html and a 200,
# including stale hashed asset URLs. A browser holding a cached index.html from
# a previous deploy then receives HTML where it expects JavaScript, fails to
# parse it as a module, and the app never boots. Letting missing assets 404
# keeps that failure honest and lets the browser recover.
not_found_handling = "none"
# Only API paths invoke the Worker; everything else is served straight from
# assets without a script execution.
run_worker_first = [ "/api/*" ]
